name: prism
description: "Prism — 双列 Material Design 3 文件管理器。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  dynamic_color: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
